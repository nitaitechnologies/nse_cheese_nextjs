name: nse-cheese

# Local development uses npm run dev and npm run dev:worker, which share
# data/nse.sqlite. The public site is a Coolify Nixpacks application.
# docs/server-setup.md is the runbook.

services:
  web:
    image: ${WEB_IMAGE:-nse-cheese-web:latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    expose:
      - "3000"
    environment:
      SQLITE_PATH: /data/nse.sqlite
      SESSION_SECRET: ${SESSION_SECRET:?}
      DASHBOARD_PASSWORD_HASH_B64: ${DASHBOARD_PASSWORD_HASH_B64:?}
      KITE_API_KEY: ${KITE_API_KEY:?}
      KITE_API_SECRET: ${KITE_API_SECRET:?}
      KITE_REDIRECT_URL: ${KITE_REDIRECT_URL:?}
      WORKER_INTERNAL_URL: http://worker:4001
      TZ: Asia/Kolkata
    volumes:
      - ./sqlite-data:/data
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: ${WORKER_IMAGE:-nse-cheese-worker:latest}
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      SQLITE_PATH: /data/nse.sqlite
      KITE_API_KEY: ${KITE_API_KEY:?}
      KITE_API_SECRET: ${KITE_API_SECRET:?}
      PUSHOVER_APP_TOKEN: ${PUSHOVER_APP_TOKEN:-}
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY:-}
      WORKER_PORT: "4001"
      TZ: Asia/Kolkata
    volumes:
      - ./sqlite-data:/data
    expose:
      - "4001"
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
